name: Data pipeline checks

"on":
  push:
    branches: [main, portfolio-improvements, analytics-reporting, batch-ingestion]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: portfolio_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_validation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Configure the disposable test database
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import psycopg2

          # These credentials belong only to this job's disposable service.
          Path(".env").write_text(
              "DB_HOST=localhost\nDB_PORT=5432\n"
              "DB_NAME=portfolio_validation\nDB_USER=postgres\n"
              "DB_PASSWORD=ci_test_password\nSTRIPE_SECRET_KEY=\n",
              encoding="utf-8",
          )
          connection = psycopg2.connect(
              host="localhost", port=5432, dbname="portfolio_validation",
              user="postgres", password="ci_test_password",
          )
          try:
              with connection:
                  with connection.cursor() as cursor:
                      for name in ("00_create_raw_tables.sql", "04_create_import_runs.sql",
                                   "05_create_ingestion_batches.sql", "06_create_batch_history.sql"):
                          cursor.execute((Path("sql_views") / name).read_text(encoding="utf-8-sig"))
          finally:
              connection.close()
          PY

      - name: Run the complete pipeline
        run: .venv/bin/python run_pipeline.py

      - name: Repeat the pipeline against existing data and views
        run: .venv/bin/python run_pipeline.py

      - name: Load and validate the initial batch
        run: >-
          .venv/bin/python run_batch_pipeline.py
          --payment-csv testdaten/batch_scenarios/01_initial/payments.csv
          --bank-csv testdaten/batch_scenarios/01_initial/bank.csv --scenario 01_initial

      - name: Repeat the same pair without adding raw rows
        run: >-
          .venv/bin/python run_batch_pipeline.py
          --payment-csv testdaten/batch_scenarios/01_initial/payments.csv
          --bank-csv testdaten/batch_scenarios/01_initial/bank.csv --scenario 01_initial

      - name: Load the updated snapshot while retaining the first
        run: >-
          .venv/bin/python run_batch_pipeline.py
          --payment-csv testdaten/batch_scenarios/02_updated/payments.csv
          --bank-csv testdaten/batch_scenarios/02_updated/bank.csv --scenario 02_updated

      - name: Check persisted results and reject malformed input without writes
        run: .venv/bin/python tests/verify_batch_history.py

      - name: Run all Python tests
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Write successful-check summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Data pipeline checks passed
          - Original pipeline ran twice: 6 views and 28 dbt tests per run.
          - Three batch validations: 6 views and 30 dbt tests per run.
          - Repeated input reused its batch; raw history contains 10 payment and 7 bank rows across two batches.
          - Initial results (1 valid / 4 findings) and updated results (2 valid / 3 findings) remain saved separately.
          - PostgreSQL acceptance checks verified all saved summaries, valid IDs, findings and report totals.
          - Malformed bank input failed without changing any batch or saved-result row.
          - 61 Python tests passed, including two original PostgreSQL importer rollback tests.
          - Other Python database tests use isolated SQLite adapters; they do not prove PostgreSQL concurrency behaviour.
          EOF
